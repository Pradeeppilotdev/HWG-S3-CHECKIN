<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWGDG S3 — QR Badge Generator</title>

  <style>
    :root {
      --ink: #1a1a2e;
      --ink-light: #3a3a5c;
      --ink-faint: #6e6e8a;
      --paper: #faf9f6;
      --paper-dark: #f0efe9;
      --paper-line: #e2e0d8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Controls Bar ────────── */
    .controls {
      position: sticky; top: 0; z-index: 100;
      background: var(--paper);
      border-bottom: 2px solid var(--ink);
      padding: 16px 24px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .controls h1 {
      font-family: 'Caveat', cursive; font-size: 1.6rem;
      margin-right: auto;
    }
    .controls input, .controls select {
      font-family: 'Inter', sans-serif;
      padding: 8px 12px; font-size: 0.9rem;
      border: 2px solid var(--ink); border-radius: 4px;
      background: var(--paper); color: var(--ink);
    }
    .controls input { width: 220px; }
    .controls button {
      font-family: 'Patrick Hand', cursive; font-size: 1rem;
      padding: 8px 18px;
      border: 2px solid var(--ink); border-radius: 4px;
      cursor: pointer; transition: all .15s;
    }
    .btn-generate {
      background: var(--ink); color: var(--paper);
      box-shadow: 3px 3px 0 var(--ink-light);
    }
    .btn-generate:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--ink-light); }
    .btn-print {
      background: var(--paper); color: var(--ink);
    }
    .btn-print:hover { background: var(--paper-dark); }
    .stat {
      font-size: 0.85rem; color: var(--ink-faint);
      font-family: 'Patrick Hand', cursive;
    }

    /* ── QR Grid ─────────────── */
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 24px;
    }
    .qr-card {
      border: 2px solid var(--ink);
      border-radius: 4px;
      padding: 16px;
      text-align: center;
      background: var(--paper);
      box-shadow: 3px 3px 0 var(--ink);
      break-inside: avoid;
    }
    .qr-card .qr-img { display: flex; justify-content: center; margin: 0 auto 10px; }
    .qr-card .qr-img img { display: block; }
    .qr-card .qr-img canvas { display: block; }
    .qr-name {
      font-family: 'Caveat', cursive; font-weight: 700;
      font-size: 1.15rem; line-height: 1.2;
    }
    .qr-team {
      font-family: 'Patrick Hand', cursive;
      font-size: 0.9rem; color: var(--ink-light);
    }
    .qr-id {
      font-size: 0.75rem; color: var(--ink-faint);
      margin-top: 2px; letter-spacing: 0.5px;
    }
    .qr-lead {
      display: inline-block; margin-top: 4px;
      padding: 1px 6px; border: 1.5px solid var(--ink);
      border-radius: 3px; font-size: 0.65rem;
      font-family: 'Patrick Hand', cursive;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ── Print ────────────────── */
    @media print {
      .controls { display: none; }
      body { background: white; }
      .qr-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px; padding: 12px;
      }
      .qr-card { box-shadow: none; border-width: 1px; padding: 10px; }
      .qr-card canvas { width: 120px !important; height: 120px !important; }
    }
  </style>
</head>

const participants = P.map(r => ({ id:r[0], name:r[1], team:r[2], isLead:!!r[3] }));

// populate team filter

const sel = document.getElementById('teamFilter');
teams.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o); });

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const team = document.getElementById('teamFilter').value;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  let filtered = participants;
  if (team) filtered = filtered.filter(p => p.team === team);
  if (q) filtered = filtered.filter(p =>
    p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
  );

  document.getElementById('stat').textContent = `${filtered.length} / ${participants.length} participants`;

  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'qr-card';

    const qrDiv = document.createElement('div');
    qrDiv.className = 'qr-img';
    card.appendChild(qrDiv);

    const nameEl = document.createElement('div');
    nameEl.className = 'qr-name';
    nameEl.textContent = p.name;
    card.appendChild(nameEl);

    const teamEl = document.createElement('div');
    teamEl.className = 'qr-team';
    teamEl.textContent = p.team;
    card.appendChild(teamEl);

    const idEl = document.createElement('div');
    idEl.className = 'qr-id';
    idEl.textContent = p.id;
    card.appendChild(idEl);

    if (p.isLead) {
      const badge = document.createElement('span');
      badge.className = 'qr-lead';
      badge.textContent = 'Team Lead';
      card.appendChild(badge);
    }

    grid.appendChild(card);

    new QRCode(qrDiv, {
      text: p.id,
      width: 150,
      height: 150,
      colorDark: '#1a1a2e',
      colorLight: '#faf9f6',
      correctLevel: QRCode.CorrectLevel.M
    });
  });
}
